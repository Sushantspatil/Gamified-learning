name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    env:
      DEFAULT_BASE_URL: https://localhost:8080
      BASE_URL: ${{ secrets.BASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Configure backend URL
        run: |
          BACKEND_URL="${BASE_URL:-$DEFAULT_BASE_URL}"
          if [ "$BACKEND_URL" = "$DEFAULT_BASE_URL" ]; then
            echo "BASE_URL repository secret is not set; using default deployed backend: $DEFAULT_BASE_URL"
          fi
          echo "BACKEND_URL=$BACKEND_URL" >> "$GITHUB_ENV"

      - name: Build APK
        run: flutter build apk --release --dart-define=BASE_URL="$BACKEND_URL"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
