<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SkillVerse Avatar</title>
    <style>
      :root {
        color-scheme: dark;
        --panel: rgba(18, 22, 44, 0.78);
        --line: rgba(255, 255, 255, 0.14);
        --accent: #22e6ff;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; background: #10142a; color: #eaf0ff;
        font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      #stage { position: fixed; inset: 0; }
      .panel { position: fixed; left: 12px; top: 12px; z-index: 2; width: min(300px, calc(100vw - 24px));
        padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
        backdrop-filter: blur(8px); display: grid; gap: 8px; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      .row b { font-weight: 600; opacity: 0.8; margin-right: 4px; }
      button { font: inherit; color: inherit; padding: 6px 12px; border-radius: 8px; cursor: pointer;
        border: 1px solid var(--line); background: rgba(255, 255, 255, 0.06); }
      button:hover { background: rgba(255, 255, 255, 0.14); }
      button[aria-pressed='true'] { border-color: var(--accent); color: var(--accent); }
      button:disabled { opacity: 0.4; cursor: default; }
      #status { opacity: 0.85; min-height: 1.4em; }
      #hint { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 2;
        padding: 6px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line);
        opacity: 0.85; white-space: nowrap; max-width: calc(100vw - 24px); overflow: hidden; text-overflow: ellipsis; }
      #overlay { position: fixed; inset: 0; z-index: 3; display: grid; place-items: center; padding: 24px;
        background: rgba(16, 20, 42, 0.92); text-align: center; }
      #overlay[hidden] { display: none; }
      #overlay .box { max-width: 520px; }
      #overlay h2 { margin: 0 0 8px; }
      #overlay code { background: rgba(255, 255, 255, 0.1); padding: 1px 6px; border-radius: 6px; }
      progress { width: 220px; accent-color: var(--accent); }
    </style>
  </head>
  <body>
    <div id="stage"></div>

    <div class="panel" id="panel" hidden>
      <div class="row">
        <b>State</b>
        <button data-state="idle" aria-pressed="false">Idle</button>
        <button data-state="walk" aria-pressed="false">Walk</button>
        <button data-state="run" aria-pressed="false">Run</button>
      </div>
      <div class="row">
        <button id="toggle-keys" aria-pressed="true">Keyboard: on</button>
        <button data-frame="full">Full</button>
        <button data-frame="bust">Bust</button>
        <button data-frame="face">Face</button>
      </div>
      <div id="status" role="status" aria-live="polite"></div>
    </div>

    <div id="hint" hidden>WASD / arrows move · Shift runs · drag to orbit · scroll to zoom</div>

    <div id="overlay">
      <div class="box" id="overlay-box">
        <h2>Loading avatar…</h2>
        <progress id="progress" max="1" value="0"></progress>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
